<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="manifest" href="/.well-known/manifest.webmanifest">
  <title>Certify (IWA)</title>
  <style>
    :root { color-scheme: dark; --bg:#0a0f12; --panel:#111a1e; --line:#213038; --fg:#e6f6f2; --muted:#8fb3ab; --accent:#0e8f7a; --ok:#34d399; --warn:#fbbf24; --err:#f87171; --crit:#fb7185; }
    * { box-sizing: border-box; }
    body { margin:0; font:14px/1.5 system-ui, sans-serif; background:var(--bg); color:var(--fg); }
    header { padding:16px 20px; background:#0e8f7a; }
    header h1 { margin:0; font-size:18px; }
    header p { margin:4px 0 0; font-size:12px; color:#d6fff6; }
    main { display:grid; grid-template-columns:360px 1fr; gap:16px; padding:16px; align-items:start; }
    .panel { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:16px; }
    label { display:block; font-size:12px; color:var(--muted); margin:10px 0 3px; }
    input[type=text], input[type=password], input[type=number], select { width:100%; padding:8px; border-radius:6px; border:1px solid var(--line); background:#0a1216; color:var(--fg); }
    .check { display:flex; align-items:center; gap:8px; margin-top:10px; }
    .check input { width:auto; }
    .actions { display:flex; gap:8px; margin-top:16px; }
    button { flex:1; padding:9px; border:0; border-radius:6px; background:var(--accent); color:#fff; font-weight:600; cursor:pointer; }
    button.secondary { background:#26333a; }
    button:disabled { opacity:.5; cursor:not-allowed; }
    .status { margin-top:12px; font-size:12px; color:var(--muted); }
    h2 { font-size:13px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin:0 0 10px; }
    table { width:100%; border-collapse:collapse; font-size:13px; }
    th, td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
    th { color:var(--muted); position:sticky; top:0; background:var(--panel); }
    td.val { font-family:ui-monospace, monospace; word-break:break-word; }
    td.mono { font-family:ui-monospace, monospace; white-space:nowrap; }
    .risk { font-weight:700; white-space:nowrap; }
    .risk.Critical { color:var(--crit); } .risk.High { color:var(--err); } .risk.Medium { color:var(--warn); } .risk.Low { color:var(--muted); }
    .esc { font-family:ui-monospace, monospace; font-weight:700; color:var(--accent); }
    .yes { color:var(--warn); font-weight:600; } .no { color:var(--muted); }
    .tablewrap { max-height:32vh; overflow:auto; border:1px solid var(--line); border-radius:8px; margin-bottom:14px; }
    .tablewrap h3 { margin:0; padding:8px 10px; font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); border-bottom:1px solid var(--line); background:#0d161a; position:sticky; top:0; z-index:2; }
    #log { background:#070c0e; border:1px solid var(--line); border-radius:8px; padding:10px; height:130px; overflow:auto; font-family:ui-monospace, monospace; font-size:12px; white-space:pre-wrap; margin-top:12px; }
    .log-err { color:var(--err); } .log-ok { color:var(--ok); }
    .summary { display:flex; flex-wrap:wrap; gap:6px; margin:0 0 12px; }
    .chip { background:#0a1216; border:1px solid var(--line); border-radius:6px; padding:3px 8px; font-size:12px; }
    .hide { display:none; }
  </style>
</head>
<body>
  <header>
    <h1>Certify <span style="opacity:.6">· Isolated Web App</span></h1>
    <p>Enumerates AD CS (CAs &amp; certificate templates) over LDAP and flags ESC1–ESC15 misconfigurations. Browser port of GhostPack/Certify. For authorised security testing only.</p>
  </header>
  <main>
    <section class="panel" id="form">
      <h2>Target</h2>
      <label>Domain Controller (host / IP)</label>
      <input id="host" type="text" placeholder="dc01.corp.local" autocomplete="off">
      <label>LDAP port</label>
      <input id="port" type="number" value="389">
      <div class="check"><input id="tls" type="checkbox"><label style="margin:0">Use TLS (LDAPS) — WASM rustls + channel binding</label></div>

      <h2 style="margin-top:16px">Credentials</h2>
      <label>Authentication</label>
      <select id="auth">
        <option value="ntlm">NTLMv2 (GSS-SPNEGO)</option>
        <option value="kerberos">Kerberos (GSS-SPNEGO)</option>
        <option value="simple">Simple bind (cleartext)</option>
      </select>
      <label>Username (user@domain or DOMAIN\user)</label>
      <input id="bind" type="text" placeholder="user@corp.local" autocomplete="off">
      <label id="domain-row">Domain / realm (optional — overrides parsed)</label>
      <input id="domain" type="text" placeholder="corp.local" autocomplete="off">
      <label id="kdc-row">KDC (optional — defaults to the DC host above)</label>
      <input id="kdc" type="text" placeholder="dc01.corp.local" autocomplete="off">
      <label>Password</label>
      <input id="password" type="password" autocomplete="off">

      <h2 style="margin-top:16px">Scan</h2>
      <label>Mode</label>
      <select id="mode">
        <option value="find">Find — CAs, templates &amp; findings</option>
        <option value="vulnerable">Vulnerable — findings only</option>
        <option value="templates">Templates only</option>
        <option value="cas">CAs only</option>
        <option value="request">Request a certificate (MS-ICPR)</option>
        <option value="auth">Authenticate (PKINIT) → NT hash (UnPAC)</option>
      </select>
      <label style="margin-top:8px"><input id="enabled-only" type="checkbox"> Enabled templates only (published by a CA)</label>
      <div id="req-opts" class="hide">
        <label>CA host (SMB / \cert pipe)</label>
        <input id="req-cahost" type="text" placeholder="ca01.corp.local" autocomplete="off">
        <label>CA name (CN)</label>
        <input id="req-ca" type="text" placeholder="corp-CA01-CA" autocomplete="off">
        <label>Template</label>
        <input id="req-template" type="text" placeholder="User" autocomplete="off">
        <label>Subject</label>
        <input id="req-subject" type="text" value="CN=User" autocomplete="off">
        <label>Alt name — UPN for ESC1 (optional)</label>
        <input id="req-altname" type="text" placeholder="administrator@corp.local" autocomplete="off">
      </div>

      <div class="actions">
        <button id="btn-run">Run</button>
        <button id="btn-clear" class="secondary">Clear</button>
      </div>
      <div class="status" id="status">Initialising…</div>
      <div id="log"></div>
    </section>

    <section class="panel" id="results">
      <div class="summary" id="summary"></div>
      <div id="tables"></div>
    </section>
  </main>
  <script type="module" src="/app.js"></script>
</body>
</html>
